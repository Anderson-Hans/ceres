# Машиночитаемая предрегистрация CERES (черновик).
# DRAFT → FROZEN только после ACCEPT_PREFLIGHT и принятия всех ADR, на которые
# есть ссылки. До FROZEN открывать OOS запрещено. Изменения после FROZEN —
# только append-only в docs/preregistration/CHANGELOG.md с датой и причиной.
schema_version: "0.2.0"
status: DRAFT

spec:
  file: docs/source/CERES-spec-v0.2.md
  sha256: db04298fdf4653eeecbb86eba581159f25bb4f0f50a71c8bfea38c9f75d44167
  execution_prompt: docs/source/CERES_EXECUTION_PROMPT_v1.0.md

preregistration:
  document: docs/preregistration.md
  version: "0.2.0-draft"
  frozen_at: null
  viewed_data: []            # рыночные/фундаментальные данные не просматривались; синтетика — не данные CERES
  changelog: docs/preregistration/CHANGELOG.md

seeds:
  global: 20260927

instruments:                  # §2.2; веса гейта — ADR-05
  - root: ZC
    contract_month: Z
    role: anchor
    marketing_year_start: "09-01"
    gate_weight: 0.5
    publish_signal: true
  - root: ZS
    contract_month: X
    role: anchor
    marketing_year_start: "09-01"
    gate_weight: 0.5
    publish_signal: true
  - root: ZW
    contract_month: N
    role: stress_test
    marketing_year_start: "06-01"
    gate_weight: 0.0          # ADR-05 п.3
    publish_signal: false     # ADR-03 INSTRUMENT_ROLE_STRESS_TEST
    regime_flag_required: true
    regime_flags:
      - {name: zw_post_2022, start: "2022-02-24", pit_note: "дата события известна с момента события; выбор флага сделан задним числом"}

target:                       # §4, ADR-02, ADR-06
  definition: "R(t,H) = log(S_obs(c,t+H) / S_obs(c,t)), один контракт, daily settlement"
  horizons_trading_days: [5, 21]
  price_field: settlement
  as_of_local_time: "18:00"
  as_of_timezone: America/Chicago
  panel: same_month_contracts_no_roll
  eligibility: "t+H <= last_eligible(c) = FND - 1 session"
  limit_days: "флаги с фазы 0; censored likelihood с B2 (ADR-02)"
  adr: [ADR-02, ADR-06]

features:
  b1_stock_feature: "x = SU(m*) - mean5(SU), все значения из одного vintage (ADR-09)"
  decile_boundaries: "training-only, по одной точке на релиз WASDE, раздельно по культуре (ADR-09)"
  adr: [ADR-09]

validation:                   # §7.2, ADR-05
  scheme: walk_forward
  window: expanding
  fold_unit: marketing_year_block
  block_year_start: "09-01"
  cutoff_local_time: "00:00"
  cutoff_timezone: America/Chicago
  burn_in_years_min: 10
  refit: once_per_cutoff
  shuffle: false
  hyperparameter_selection: inner_folds_forward_chaining   # последние min(5, n_train-5) training-лет
  oos_role: confirmation_only
  adr: [ADR-05]

metrics:                      # §7.2
  primary: crps
  model_selection: [crps]
  calibration: [brier, reliability, coverage_90]
  reference_only: [accuracy]
  full_eligible_sample: true  # основной CRPS на всех пригодных днях, не только SIGNAL
  adr: [ADR-05]

models:
  B0:
    definition: "median-centered seasonal empirical distribution (RW location, climatological shape)"
    seasonal_window_half_width: 10
    seasonal_window_sensitivity: [5, 10, 15]
    reported_variants: [B0-CLIM, B0-RW]
    b0_rw_vol_window_sessions: 63
    adr: [ADR-01]
  B1:
    event: "E = 1[d * R > 0], d = sign(train seasonal median), R = 0 -> E = 0"
    groups: [crop, horizon, decile]
    prior: {a0: 1.0, b0: 1.0, sensitivity: [0.5, 2.0]}
    overlap_weight: "1/H per row"
    alternative_weighting: "ADR-11 (Proposed): weight 1 per independent episode (crop, marketing year); not applied until accepted"
    half_life_years_grid: [2, 4, 8, 16, .inf]
    n_groups: 10               # децили v0.2; автоподбор и перебор запрещены
    observation_unit: "row = (crop, H, date); independent fundamental episode = (crop, marketing year, WASDE release)"
    fill_analysis: "training-only, first cutoff, before OOS; table crop x H x decile -> releases, distinct MY, n_w"
    empty_class: "B1_no_deciles of same crop x horizon -> ABSTAIN B1_EMPTY_CLASS"
    return_envelope: "p_E * F(r|E=1) + (1-p_E) * F(r|E=0), cascade k=10 -> k=21 -> all-season -> ABSTAIN"
    mandatory_control: B1_no_deciles
    adr: [ADR-01, ADR-05, ADR-09]
  B1_no_deciles:
    definition: "B1 without decile conditioning; same event, as_of, prior, weights, half-life, envelope"
    groups: [crop, horizon]
    adr: [ADR-01]
  B2:
    status: specified_proposed
    spec_file: configs/model-b2.yaml
    adr: [ADR-10, ADR-02, ADR-03, ADR-05]

gate_phase1:                  # §9 + предлагаемое дополнение (рецензия §4, ADR-01 п.4b)
  rule: "mean_w brier_E(B1) < mean_w brier_E(B0) and mean_w brier_E(B1) < mean_w brier_E(B1_no_deciles)"
  sample: "all eligible OOS rows ZC+ZS, both H, weights as gate_phase2"
  event: E
  significance_barrier: none   # решение по точечным оценкам; разности и CI публикуются
  report: [difference_vs_B0, difference_vs_B1_no_deciles, ci95_two_sided_same_method_as_gate2, n_blocks]
  adr: [ADR-01]

gate_phase2:                  # §10 (формализация — [EXEC]); не ослабляется
  rule: "lower_bound_ci95_skill_crps_vs_b0 > 0"
  skill: "1 - sum_w CRPS(B2) / sum_w CRPS(B0)"     # отношение средних, не среднее индивидуальных skill
  horizon_weights: {"5": 0.5, "21": 0.5}
  within_cell_weight: equal_per_eligible_date
  missing_forecast: "replace with registered fallback distribution (B0), disclose share"
  undefined_denominator: NOT_EVALUABLE
  too_few_blocks: "NOT_EVALUABLE if n_blocks < admissible minimum of the registered CI method"
  ci:
    sided: two_sided
    level: 0.95
    primary: JK2                 # единственный кандидат, прошедший критерий (A) ADR-05 п.2.6 (синтетика, до OOS)
    primary_definition: "delete-one-block jackknife, blocks = pairs of adjacent Sep-Aug periods, t(k2-1), centered at theta_hat"
    min_blocks: 10               # k < 10 -> NOT_EVALUABLE
    reported_sensitivities: [JK, PB]
    evidence: artifacts/preflight-r2-2026-09-27/synthetic/simstudy/simstudy-admissibility.json
    forbidden: [IID_rows]
    blocks: "uncertainty block = Sep-Aug calendar period, common to all crops and horizons"
    procedure: "paired; delete/resample blocks of the causal OOS ledger; no refit"
    admissibility: "lower-tail error <= 0.025 + 2*MCSE in all registered scenarios for k >= 10; coverage reported"
    sensitivity: [JK_single_years, PB_percentile, leave_one_block_out_influence]
  bootstrap:
    unit: uncertainty_block_year
    method: paired_percentile
    n_resamples: 10000
  b2_vs_b1: "mean_w CRPS(B2) < mean_w CRPS(B1-envelope), same targets"
  calibration: "coverage90 in [0.85,0.95] and block CI contains 0.90; recalibration CI contains a=0,b=1"
  mcmc: "r_hat < 1.01; bulk/tail ESS >= 400 (proposal); divergences == 0"
  adr: [ADR-01, ADR-03, ADR-05]

decision_config: configs/decision.yaml

observers:
  phase0: [usda_wasde, usda_crop_progress, usda_grain_stocks]
  phase3_ablation_order: [noaa_weather, cftc_cot, usda_export_sales]
  phase3_features: pending_registration
  markers_phase3: [calendar, weather, regime, market_anomaly_calendar_spread, market_anomaly_oi_concentration, market_anomaly_basis]
  basis_indicator: "kept in v1 (§8); NOT_EVALUATED without inputs; readiness assessment due before phase 3 (ADR-04 v1.1)"
  adr: [ADR-04]

open_items:
  - {id: OI-01, text: "Аудитор: принять/отклонить ADR-01..ADR-11", adr: ADR-01}
  - {id: OI-02, text: "Спецификация B2 предложена (ADR-10); требуется решение аудитора до OOS фазы 1", adr: ADR-10}
  - {id: OI-03, text: "Признаки наблюдателей фазы 3 — зарегистрировать до фазы 3", adr: ADR-04}
  - {id: OI-04, text: "10 децилей сохранены; training-only анализ наполненности — до OOS (фаза 0/1)", adr: ADR-09}
  - {id: OI-05, text: "Основной метод CI §10: предложен JK2 по критерию (A); требуется решение аудитора", adr: ADR-05}
  - {id: OI-10, text: "Эпизодное взвешивание B1 (ADR-11): принять или отклонить до OOS", adr: ADR-11}
  - {id: OI-06, text: "Правило фазы 1 с B1_no_deciles предложено; требуется решение аудитора", adr: ADR-01}
  - {id: OI-07, text: "Интерпретация «пониженного веса» ZW как веса 0 в гейте и запрета SIGNAL", adr: ADR-05}
  - {id: OI-08, text: "Индикатор базиса сохранён; оценка готовности — до фазы 3", adr: ADR-04}
  - {id: OI-09, text: "Проверка источников (E3) и доступы: сеть, EOD, шкала лимитов", adr: ADR-04}
